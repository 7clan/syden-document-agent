[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syden-document-agent"
version = "0.1.0"
description = "Source-grounded PDF, Excel and Word document analysis agent for the SYDEN technical assessment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pdfplumber>=0.11,<1",
  "openpyxl>=3.1,<4",
  "xlrd>=2.0,<3",
  "python-docx>=1.1,<2",
  "streamlit>=1.40,<2",
  "google-genai>=1.0,<2",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
openai = ["openai>=1.80,<3"]
llama = ["openai>=1.80,<3"]  # Groq/other Chat Completions-compatible Llama hosts
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "xlwt>=1.3,<2", "reportlab>=4,<5"]

[project.scripts]
syden-agent = "syden_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest_tmp"

[tool.ruff]
line-length = 100
